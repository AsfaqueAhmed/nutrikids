services:
  db:
    image: postgres:16
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: nutrikids
      POSTGRES_PASSWORD: nutrikids
      POSTGRES_DB: nutrikids
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrikids"]
      interval: 2s
      retries: 20
